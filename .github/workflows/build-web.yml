name: build-web

# Proves the deployable site builds from a clean checkout with no local ITU
# data — the same path Cloudflare Pages takes.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build:web
      - name: Check the engine's data actually landed
        run: |
          test -s apps/web/vendor/iturhfprop.wasm
          test -s apps/web/vendor/tokens.css
          test "$(find apps/web/data/itu -name 'ionos*.bin' -size +1M | wc -l)" -ge 1
      - uses: actions/upload-artifact@v4
        with:
          name: hfkit-web
          path: apps/web
          retention-days: 7
