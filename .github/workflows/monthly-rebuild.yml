name: monthly-rebuild

# The site publishes only the month it was built in, and both pages ask for the
# month it currently *is*. So a deploy made in August stops working on 1
# September. This nudges the host to rebuild on the 1st.
#
# It pushes an empty commit rather than calling a deploy API: that works with
# whatever git-connected build the host has, needs no API tokens, and leaves the
# reason in the history. If you later deploy with wrangler from CI instead,
# replace the push step with the deploy and keep everything else.
#
# 02:00 UTC, not 00:00 — being an hour or two late on the 1st is harmless, and
# GitHub's scheduler is busiest on the hour.

on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this run was triggered by hand'
        required: false
        default: 'manual rebuild'

# A scheduled workflow runs on the *default* branch, which is not necessarily
# the branch the host deploys. Defaulting to github.ref_name assumed they were
# the same; on 2026-09-01 they were not, so the rebuild commit landed on a
# working branch, this job went green, and production served August's ITU data
# until the canary caught it the next morning. Name the deployed branch instead.
# DEPLOY_BRANCH (a repository variable) overrides it if that ever changes.
env:
  DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH || 'main' }}
  SITE_URL: ${{ vars.SITE_URL || 'https://hfkit.caldwell.tech' }}

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}
          fetch-depth: 1

      - name: Confirm the rebuild is actually needed
        id: check
        run: |
          MONTH=$(date -u +%m)
          echo "month=$MONTH" >> "$GITHUB_OUTPUT"
          echo "Current UTC month is $MONTH; the deploy must serve ionos$MONTH.bin."

      - name: Push an empty commit to trigger the host's build
        run: |
          MONTH="${{ steps.check.outputs.month }}"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m "chore: rebuild for month $MONTH ITU data

          The published ITU coefficient set covers only the month the build ran
          in, so the site must be rebuilt at each month boundary or predictions
          request a file that was never deployed.

          Triggered by .github/workflows/monthly-rebuild.yml."
          git push origin "HEAD:${{ env.DEPLOY_BRANCH }}"

      # Pushing is not deploying. Without this the job reports success for
      # having made a commit, which is the failure mode that let September
      # break: green here, dead in production. The host builds asynchronously,
      # so poll the live origin until it can actually serve this month's data.
      #
      # The full check downloads the 11 MB file each attempt. That is our own
      # origin, not a volunteer service, and this runs once a month.
      - name: Verify the live site really picked it up
        run: |
          MONTH="${{ steps.check.outputs.month }}"
          sleep 120                       # no build finishes faster than this
          for attempt in $(seq 1 12); do
            if ./scripts/check-live.sh "$SITE_URL" "$MONTH"; then
              exit 0
            fi
            echo "--- attempt $attempt: not deployed yet, waiting 90s ---"
            sleep 90
          done
          echo
          echo "The commit was pushed to ${{ env.DEPLOY_BRANCH }} but $SITE_URL"
          echo "never started serving month $MONTH. Check that the host builds"
          echo "that branch, and that its last build succeeded."
          exit 1
