name: live-canary

# Can the deployed site actually predict *today*?
#
# This exists because the monthly rebuild is a cron job, and a cron job that
# silently does not fire looks exactly like one that did. monthly-rebuild.yml is
# the fix; this is how you find out it did not happen — before a user does.
#
# Deliberately checks the live origin rather than the repository: a green build
# proves the artifact was correct when it was made, which is not the same claim.

on:
  schedule:
    - cron: '17 6 * * *'          # daily, off the hour
  workflow_dispatch:
    inputs:
      month:
        description: 'Two-digit month to check (blank = current UTC month)'
        required: false
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the live site
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://hfkit.caldwell.tech' }}
        run: ./scripts/check-live.sh "$SITE_URL" "${{ inputs.month }}"
